name: Marketplace CI
on:
  push:
    paths: ["marketplace/**", ".github/workflows/marketplace-ci.yml"]
  pull_request:
    paths: ["marketplace/**", ".github/workflows/marketplace-ci.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: marketplace } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: marketplace/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: marketplace/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:db
      - run: pnpm build
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
